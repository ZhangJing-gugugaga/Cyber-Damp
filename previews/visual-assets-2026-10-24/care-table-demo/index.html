<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>回南天 · 护理台交互小样</title>
<style>
:root{font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;color:#314d59;background:#c1d4df;font-size:14px}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 18% 12%,#e6eff3,transparent 65%),linear-gradient(130deg,#cadde3,#94b5c9)}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #15799e;outline-offset:4px}.window{width:min(960px,96vw);background:#edf3f5;border:1px solid #f5fafc;border-radius:16px;box-shadow:0 24px 80px #36566c40;overflow:hidden;margin:20px}header{height:60px;padding:0 25px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #d0dfe5}header strong{font-family:'KaiTi',serif;font-size:24px;letter-spacing:4px}header small{color:#7b929d}.spacer{flex:1}.coin{font-size:13px;color:#6e694a;background:#e8e5cc;padding:7px 13px;border-radius:20px}nav{display:flex;gap:8px;padding:15px 25px 0}nav button{padding:10px 17px;background:transparent;border-radius:8px}nav button.active{background:#d5e5ea;color:#27657c;font-weight:bold}.page{display:none}.page.active{display:block}.scene{position:relative;margin:18px 25px 0;height:390px;border-radius:12px;background:linear-gradient(#dbe9ee 0%,#dbe9ee 75%,#c8dbe0 75%,#c0d3da 100%);overflow:hidden;border:1px solid #bcd0d9}.scene:before{content:'';position:absolute;left:25px;top:25px;width:125px;height:165px;border:7px solid #b5cbd5;background:linear-gradient(90deg,transparent 47%,#b5cbd5 48%,#b5cbd5 52%,transparent 53%),linear-gradient(transparent 47%,#b5cbd5 48%,#b5cbd5 52%,transparent 53%),linear-gradient(125deg,#e8f3f6,#c7dce7);box-shadow:8px 10px 0 #b7cdd344}.note{position:absolute;right:25px;top:23px;line-height:1.9;font-size:12px;color:#66838f;text-align:right}.note b{color:#416370;font-weight:500;font-size:14px}.mat{position:absolute;width:370px;height:70px;left:50%;bottom:30px;transform:translateX(-50%);border-radius:50%;background:#a9c6ce;border:1px solid #98b7c1;box-shadow:0 8px 15px #698d9920}.specimen{position:absolute;width:278px;height:278px;left:50%;top:37px;transform:translateX(-50%);touch-action:none;filter:drop-shadow(0 15px 9px #385a6b24)}.specimen>img,.specimen canvas{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.specimen canvas{cursor:crosshair}.mushroom{position:absolute;z-index:2;background:none;padding:8px;font-size:37px;line-height:1;filter:drop-shadow(0 3px 2px #47634c30);transition:transform .12s}.mushroom:hover{transform:rotate(-10deg) scale(1.13)}.mushroom:disabled{cursor:default}.caption{position:absolute;bottom:9px;text-align:center;width:100%;font-size:12px;color:#577581}.caption strong{font-size:15px;color:#355563}.toolbar{position:absolute;right:25px;bottom:50px;display:grid;gap:9px}.tool{width:64px;height:64px;background:#f1f6f7;border:1px solid #b4cbd5;border-radius:12px;box-shadow:0 4px 0 #a9c0ca;display:grid;place-content:center;gap:4px;font-size:11px}.tool span{font-size:25px}.tool.selected{background:#d5edee;border-color:#4f929a;box-shadow:0 4px 0 #72a6ae}.hint{display:flex;padding:15px 28px;gap:15px;align-items:center;min-height:53px}.hint span{flex:1}.hint button{background:transparent;text-decoration:underline;color:#6b8792;font-size:12px}.rack{padding:0 25px 24px;display:flex;gap:12px}.file{flex:1;padding:13px 10px;background:#e4edf1;border:1px solid transparent;border-radius:9px;display:flex;gap:12px;align-items:center;text-align:left}.file.selected{border-color:#6b9bad;background:#f9fcfd}.file img{width:47px;height:47px;object-fit:contain}.file small{display:block;color:#7d939d;margin-top:4px}.content{padding:28px;min-height:510px}.content h2{font-size:23px;font-weight:500;margin:0 0 8px}.muted{color:#78909b;line-height:1.8}.products{display:flex;gap:20px;margin-top:30px}.product{background:#e1ecef;border-radius:12px;padding:25px;flex:1}.product .emoji{font-size:55px;display:block;margin-bottom:20px}.product button,.primary{padding:11px 18px;background:#477c8d;color:white;border-radius:7px;margin-top:14px}.settings label{display:flex;justify-content:space-between;padding:22px 0;border-bottom:1px solid #d4e1e6}.collection{font-size:70px;margin-top:40px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#355765;color:white;padding:12px 22px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}footer{border-top:1px solid #d4e1e6;padding:12px 25px;color:#8499a1;font-size:11px;display:flex;justify-content:space-between}@media(max-width:650px){header small,.note,.scene:before{display:none}.scene{margin:12px;height:380px}.specimen{width:235px;height:235px;top:35px;left:43%}.mat{width:280px;left:43%;bottom:50px}.toolbar{right:12px;bottom:80px}.rack{padding:0 12px 18px;gap:5px}.file{display:block;font-size:12px;text-align:center}.file img{width:40px;height:40px}.products{flex-direction:column}.hint{font-size:12px;padding:12px}.caption{bottom:18px}nav{padding-left:12px;gap:0}nav button{padding:10px 13px}}
</style>
<main class="window">
<header><strong>回南天</strong><small>把潮湿的日子，慢慢收拾好。</small><div class="spacer"></div><span class="coin">◉ <b id="coins">24</b> 菇币</span></header>
<nav aria-label="主导航"><button class="active" data-page="care">护理台</button><button data-page="collection">收集盒 <span id="count">0</span></button><button data-page="shop">小铺</button><button data-page="settings">设置</button></nav>
<section class="page active" id="care"><div class="scene"><div class="note"><b>今天，一点新的潮意。</b><br>今日自然变化：1 个图标<br>其余时间，安心用你的桌面。</div><div class="mat"></div><div class="specimen" id="specimen"><img src="../native-icon-reference/source-icons/02.png" alt="干净的原生文件夹"><canvas id="mold" width="560" height="560" aria-label="按住并拖动以擦拭图标"></canvas><div id="mushrooms"></div></div><div class="toolbar" aria-label="护理工具"><button class="tool selected" data-tool="wipe"><span>🧽</span>擦洗</button><button class="tool" data-tool="pick"><span>✂️</span>采菇</button></div><div class="caption"><strong id="filename">灵感收集</strong>　<span id="stage">重度发霉</span></div></div><div class="hint"><span id="hint" role="status">拿起海绵，按住图标来回擦一擦。</span><button id="finish">完成清洗</button><button id="reset">重新体验</button></div><div class="rack" id="rack"></div></section>
<section class="page" id="collection"><div class="content"><h2>收集盒</h2><p class="muted">从熟悉的图标里，收下一点小惊喜。</p><div class="collection" id="harvested">还没有蘑菇</div><p class="muted" id="harvestText">回护理台，用剪刀采摘图标上的蘑菇。</p></div></section>
<section class="page" id="shop"><div class="content"><h2>巷口小铺</h2><p class="muted">给护理台添一点顺手的小东西。</p><div class="products"><article class="product"><span class="emoji">🧽</span><b>大块海绵</b><p class="muted">擦得更宽，收拾起来更轻松。</p><button id="buySponge">12 菇币 · 换一块</button></article><article class="product"><span class="emoji">🪷</span><b>荷叶垫</b><p class="muted">给今天的护理台换个心情。</p><button id="buyMat">8 菇币 · 带回家</button></article></div></div></section>
<section class="page" id="settings"><div class="content settings"><h2>按你的节奏来</h2><label>操作声音<input type="checkbox" id="sound"></label><label>暂停每日自然变化<input type="checkbox" id="pause"></label><p class="muted">自然变化每天只推进一个图标。清洗与采摘都在护理台进行。</p><button class="primary" id="restore">恢复小样中的全部图标</button><p class="muted">这是交互小样，所有变化只发生在此页面，不会修改桌面文件。</p></div></section>
<footer><span id="daily">每日只变化一个图标</span><span>交互概念小样 · 未连接真实桌面</span></footer></main><div class="toast" id="toast" role="status"></div>
<script>
// Existing approved artwork is reused. Erasing uses the standard Canvas destination-out operation.
// Reference: https://github.com/mdn/content/blob/main/files/en-us/web/api/pointer_events/using_pointer_events/index.md
const $=s=>document.querySelector(s),files=[{name:'灵感收集',stage:'重度发霉',asset:'folder-cartoon-heavy.png',picks:3},{name:'工作资料',stage:'中度发霉',asset:'folder-cartoon-medium.png',picks:1},{name:'随手记',stage:'初期发霉',asset:'folder-cartoon-v1.png',picks:0}];
let current=0,tool='wipe',coins=24,harvest=0,brush=27,drag=false,last=null,ready=false,generation=0,audio;const c=$('#mold'),ctx=c.getContext('2d'),images=files.map(f=>{let i=new Image;i.src='../art-drafts/'+f.asset;return i});
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function beep(){if(!$('#sound').checked)return;try{audio??=new AudioContext;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(650,audio.currentTime);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);o.start();o.stop(audio.currentTime+.1)}catch{}}
function update(){ $('#coins').textContent=coins;$('#count').textContent=harvest;$('#harvested').textContent=harvest?'🍄'.repeat(Math.min(harvest,12)):'还没有蘑菇';$('#harvestText').textContent=harvest?`已经收下 ${harvest} 朵蘑菇。`:'回护理台，用剪刀采摘图标上的蘑菇。';}
function rack(){ $('#rack').replaceChildren();files.forEach((f,i)=>{const b=document.createElement('button');b.className='file'+(i===current?' selected':'');b.innerHTML=`<img src="${f.clean?'../native-icon-reference/source-icons/02.png':'../art-drafts/'+f.asset}" alt=""><span>${f.name}<small>${f.clean?'已清洗':f.stage}${i===0?' · 今日变化':''}</small></span>`;b.onclick=()=>load(i);$('#rack').append(b)});}
function mushrooms(){ $('#mushrooms').replaceChildren();const f=files[current];for(let n=0;n<f.picks;n++){const b=document.createElement('button');b.className='mushroom';b.textContent='🍄';b.style.left=(15+n*23)+'%';b.style.top=(57+(n%2)*12)+'%';b.ariaLabel='采摘蘑菇';b.onclick=()=>{if(tool!=='pick'){toast('先拿起右边的采菇剪刀');return}f.picks--;harvest++;coins+=4;beep();mushrooms();update();toast('收下一朵蘑菇，+4 菇币')};$('#mushrooms').append(b)}}
async function load(i){save();current=i;drag=false;last=null;ready=false;const g=++generation,f=files[i];$('#filename').textContent=f.name;$('#stage').textContent=f.clean?'干干净净':f.stage;ctx.clearRect(0,0,560,560);if(!f.clean){const im=f.saved||images[i];try{await im.decode();if(g!==generation)return;ctx.globalCompositeOperation='source-over';ctx.drawImage(im,0,0,560,560)}catch{toast('图标未能载入，请保留小样与美术资产的相对目录')}}ready=true;mushrooms();rack();}
function save(){if(!ready)return;const im=new Image;im.src=c.toDataURL();files[current].saved=im;}
function selectTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('selected',b.dataset.tool===t));c.style.pointerEvents=t==='wipe'?'auto':'none';$('#hint').textContent=t==='wipe'?'按住图标来回擦拭。蘑菇需要单独采摘。':'点击图标上的蘑菇，把它收进盒子。';}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*560/r.width,y:(e.clientY-r.top)*560/r.height}}
function wipe(e){if(!drag||tool!=='wipe'||!ready)return;const p=point(e);ctx.globalCompositeOperation='destination-out';ctx.lineWidth=brush*2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last?.x??p.x,last?.y??p.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
c.onpointerdown=e=>{if(e.button!==0)return;drag=true;last=null;c.setPointerCapture(e.pointerId);wipe(e)};c.onpointermove=wipe;c.onpointerup=c.onpointercancel=()=>{drag=false;last=null;save()};
$('#finish').onclick=()=>{const f=files[current];if(f.picks){toast('先把蘑菇采下来，再完成清洗');return}ctx.clearRect(0,0,560,560);f.clean=true;f.saved=null;$('#stage').textContent='干干净净';rack();beep();toast('清洗完成。正式版将在这里同步桌面图标。')};
$('#reset').onclick=()=>{files[current].clean=false;files[current].saved=null;files[current].picks=[3,1,0][current];ready=false;load(current)};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.page));document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n===b))});
$('#buySponge').onclick=()=>{if(brush>27)return;if(coins<12){toast('菇币不够，可以先采几朵蘑菇');return}coins-=12;brush=45;update();$('#buySponge').textContent='已放到工具架';$('#buySponge').disabled=true;toast('大块海绵已换上，回护理台试试')};
$('#buyMat').onclick=()=>{if($('#buyMat').disabled)return;if(coins<8){toast('菇币不够');return}coins-=8;update();$('.mat').style.background='#95bbae';$('#buyMat').textContent='已铺好';$('#buyMat').disabled=true;toast('荷叶垫已经铺好了')};
$('#pause').onchange=e=>$('#daily').textContent=e.target.checked?'每日自然变化已暂停':'每日只变化一个图标';
$('#restore').onclick=()=>{ready=false;files.forEach(f=>{f.clean=true;f.saved=null;f.picks=0});load(current);toast('小样中的图标已恢复')};
update();load(0);
</script></html>
