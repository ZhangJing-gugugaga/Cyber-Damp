<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霉斑合成 · 三色对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dbe7ed;color:#304b58;font:14px 'Microsoft YaHei UI',sans-serif}main{max-width:1120px;margin:35px auto;padding:0 25px}h1{font-size:25px;font-weight:550}p{color:#637c88;line-height:1.8}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header p{flex:1}button{padding:10px 15px;border:1px solid #9fb7c2;background:#f5f9fa;border-radius:7px;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #33809b}.grid{display:grid;grid-template-columns:110px repeat(4,1fr);gap:1px;background:#bccfd8;border:1px solid #bccfd8;border-radius:12px;overflow:hidden}.cell{background:#edf3f6;min-height:235px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;padding:18px}.cell.label,.head{min-height:50px;font-size:13px}.label{font-weight:600}.head{background:#d0e0e7;padding:18px;text-align:center}canvas{width:150px;height:150px;filter:drop-shadow(0 5px 4px #203d4922)}small{color:#738a94;font-size:11px}.sizes{display:flex;align-items:center;gap:12px;height:43px}.sizes img{width:32px;height:32px}.sizes img+img{width:48px;height:48px}.dark .cell{background:#293941}.dark .label{color:#dbe8ec}.dark small{color:#a4bbc4}footer{padding:20px 0;font-size:12px;color:#647e8a}@media(max-width:700px){main{padding:0 10px}.grid{grid-template-columns:70px repeat(4,1fr)}.cell{padding:9px 3px;min-height:150px}canvas{width:70px;height:70px}.sizes{gap:3px}.sizes img{width:24px;height:24px}.sizes img+img{width:32px;height:32px}.head{padding:12px 3px}}
</style><main><h1>同一套霉斑，三种底色。</h1><header><p>保留原生图标，以边角为起点逐步生长。每格下方为 32 / 48 像素实际尺寸。</p><button id="bg">切换深色底</button><button id="download">下载九张 PNG</button></header><div class="grid" id="grid"></div><footer id="status">正在合成…</footer><p>这是程序合成的风格试验：不调用生图 API。三档共用同一组霉斑形状，逐级增加覆盖；原图不重绘。仅供比较视觉，不改动桌面。</p></main>
<script>
// Reuse extracted native artwork and standard Canvas compositing; no external libraries.
// API reference: https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/globalCompositeOperation
const icons=[['WorkBuddy','12'],['ZCode','13'],['学习通','16']],stages=['原生','轻度','中度','重度'],grid=document.querySelector('#grid'),exports=[];
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296}}
function canvas(){const c=document.createElement('canvas');c.width=c.height=256;return c}
// All icons share the exact same overlay. Pale rims keep clusters visible on dark backgrounds.
function overlay(stage){const c=canvas(),x=c.getContext('2d'),random=rng(4721),anchors=[[39,198],[208,60],[69,53],[211,206],[27,113],[135,224],[174,30],[224,137],[111,74]];const count=[0,2,5,9][stage];for(let n=0;n<count;n++){const [ax,ay]=anchors[n];const r=(stage===1?12:stage===2?17:24)+random()*8;
 const lobes=9; x.beginPath();for(let j=0;j<=lobes*6;j++){const a=j/(lobes*6)*Math.PI*2,rr=r*(.88+.11*Math.sin(a*lobes)+.05*Math.cos(a*5));const px=ax+Math.cos(a)*rr,py=ay+Math.sin(a)*rr;j?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle='#c4dfb6';x.fill();x.strokeStyle='#e3ebcd';x.lineWidth=3;x.stroke();
 for(let k=0;k<13;k++){const a=random()*6.283,d=random()*r*.68,rr=2+random()*6;x.beginPath();x.arc(ax+Math.cos(a)*d,ay+Math.sin(a)*d,rr,0,7);x.fillStyle=['#749e83','#91b291','#b4cb9c','#567f70'][k%4];x.fill()}
 for(let k=0;k<7;k++){const a=random()*6.283,d=r*(1.1+random()*.65);x.beginPath();x.arc(ax+Math.cos(a)*d,ay+Math.sin(a)*d,1+random()*2,0,7);x.fillStyle='#c5d8ad';x.fill()}
 }return c}
async function build(){for(const t of ['',...stages]){const d=document.createElement('div');d.className='head';d.textContent=t;grid.append(d)}for(const [name,id]of icons){const label=document.createElement('div');label.className='cell label';label.textContent=name;grid.append(label);const im=new Image;im.src='../native-icon-reference/source-icons/'+id+'.png';await im.decode();for(let s=0;s<4;s++){const c=canvas(),x=c.getContext('2d');x.drawImage(im,0,0,256,256);if(s){const layer=overlay(s),l=layer.getContext('2d');l.globalCompositeOperation='destination-in';l.drawImage(im,0,0,256,256);x.drawImage(layer,0,0)}const cell=document.createElement('div');cell.className='cell';cell.append(c);const sizes=document.createElement('div');sizes.className='sizes';for(let z=0;z<2;z++){const preview=new Image;preview.src=c.toDataURL();preview.alt=name+' '+stages[s];sizes.append(preview)}cell.append(sizes);grid.append(cell);if(s)exports.push({name:name+'-'+stages[s]+'.png',url:c.toDataURL()})}}document.querySelector('#status').textContent='已合成 9 张透明 PNG · 同一套霉斑适配青绿、黑白、红白三种图标';}
document.querySelector('#bg').onclick=()=>grid.classList.toggle('dark');document.querySelector('#download').onclick=async()=>{for(const f of exports){const a=document.createElement('a');a.href=f.url;a.download=f.name;a.click();await new Promise(r=>setTimeout(r,220))}document.querySelector('#status').textContent='已发起九张 PNG 下载；浏览器可能要求允许多文件下载。'};build().catch(e=>{document.querySelector('#status').textContent='素材载入失败：'+e.message});
</script></html>
