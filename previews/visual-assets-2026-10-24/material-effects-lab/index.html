<main><h1>先看小图，再看材质。</h1><p>霉变 / 水渍 / 焦化。轻度就有清楚的块面变化，三档沿同一种生长方式推进。</p>
<div class="controls"><label>桌面底色<select id="background"><option value="light">浅色</option><option value="dark">深色</option><option value="blue">蓝色桌面</option></select></label><label>观察尺寸<select id="size"><option value="small">32 + 48 像素</option><option value="large">96 + 128 像素</option></select></label><div class="toolbar-spacer"></div><button id="download">下载当前效果的 PNG</button></div>
<div class="families" id="families"></div><div class="styles" id="styles"></div><p class="description" id="description"></p>
<div class="legend" id="rule">水渍默认蓝色；原图蓝色、青蓝或接近蓝色时，整枚图标切换为灰黑暗沉水渍。</div>
<div class="grid-wrap"><div class="grid" id="grid"></div></div><footer id="status" role="status">正在准备原生图标…</footer>
<section class="board"><h2>十二种中度效果，同尺寸比较</h2><p class="checklist">每组依次为学习通、CC Switch、腾讯会议。先比较大块分布、冷暖和明暗，再看细节。</p><div class="board-grid" id="board"></div></section>
