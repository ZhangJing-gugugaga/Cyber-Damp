<main><header><h1>回南天</h1><small>长出来的小东西，也值得好好收下。</small><span>收集盒　<b id="count">0</b> 朵</span></header>
<section class="scene"><div class="windowpane"></div><div class="label"><b>今天照顾这一枚。</b><br>蘑菇、工具与接触反馈</div><img class="mat" src="svg/mat.svg" alt="护理垫"><div class="target" id="target"><img class="icon" id="original" alt="WorkBuddy 原图"><canvas id="mold" width="256" height="256" aria-label="按住拖动擦拭霉斑"></canvas><div id="plants"></div></div><div class="tools"><button class="tool selected" data-tool="sponge"><img src="svg/sponge-idle.svg" alt="">海绵</button><button class="tool" data-tool="scissors"><img src="svg/scissors-idle.svg" alt="">采菇剪</button><button class="tool" data-tool="cloth"><img src="svg/cloth-idle.svg" alt="">擦水布</button></div><div class="basket"><img src="svg/basket.svg" alt="收集篮"><span id="basketText">还空着，慢慢来。</span></div><div class="caption"><b>WorkBuddy</b><span id="condition">有霉斑 · 有成熟蘑菇</span></div></section>
