<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 1 · 晾衣绳 v2（精修）</title>
<!--
  方向 1 · 晾衣绳 v2（用户 2026-10-26 选定后的精修版；v1 保留为 dir-1.html）
  色彩论证：南方老房子的回南天——返潮的石灰墙（暖白，低彩）、半墙浅绿瓷砖、水磨石地面、
  搪瓷盆（米白内壁 + 钴蓝口沿 + 盆底红鲤鱼）、木衣夹与麻绳（暖木），窗外斜进来的一道太阳（蜜黄）。
  有彩色只有钴蓝、鲤鱼红、蜜黄三个，色相角互相拉开 >60°；其余是墙面明度序列。
  form 来自内容：回南天衣服晾不干——桌面图标也被衣夹夹起来晾；洗完挂到太阳那根绳上晒。
-->
<style>
  :root {
    --plaster: oklch(0.955 0.012 95); --plaster-2: oklch(0.925 0.016 100);
    --stain: oklch(0.78 0.035 135); --stain-edge: oklch(0.66 0.045 125);
    --tile: oklch(0.90 0.035 165); --grout: oklch(0.80 0.03 165);
    --ink: oklch(0.29 0.03 250); --ink-2: oklch(0.47 0.03 250); --ink-3: oklch(0.60 0.02 250);
    --enamel: oklch(0.975 0.008 95); --cobalt: oklch(0.45 0.13 260); --carp: oklch(0.62 0.17 32);
    --wood: oklch(0.70 0.08 68); --wood-d: oklch(0.55 0.08 60); --wood-l: oklch(0.80 0.07 75);
    --rope: oklch(0.70 0.05 75); --rope-d: oklch(0.55 0.05 70);
    --sun: oklch(0.91 0.11 92);
    --cn: "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
    --num: "Arial Rounded MT Bold", "Noto Sans SC", sans-serif;
    --hand: "华文行楷", "STXingkai", "楷体", "KaiTi", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; height: 640px; overflow: hidden; background: var(--plaster); font-family: var(--cn); color: var(--ink); user-select: none; -webkit-font-smoothing: antialiased; }
  #room { position: relative; width: 960px; height: 640px; overflow: hidden; }
  svg.layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* 挂件：衣夹直接夹住原图标 */
  .hang { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .hang .body { position: absolute; left: -36px; top: -6px; width: 72px; height: 120px; transform-origin: 36px 0; cursor: grab; touch-action: none; }
  .hang .pin { position: absolute; left: 28px; top: -14px; width: 16px; height: 40px; z-index: 3; pointer-events: none; }
  .hang .icon { position: absolute; left: 4px; top: 10px; width: 64px; height: 64px; pointer-events: none;
    filter: drop-shadow(0 1px 0 oklch(1 0 0 / .6)) drop-shadow(3px 7px 5px oklch(0.35 0.03 120 / .28)); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  .hang .tag { position: absolute; left: 36px; top: 78px; transform-origin: 0 0; pointer-events: none; }
  .hang .tag .str { position: absolute; left: 0; top: 0; width: 1px; height: 12px; background: var(--rope-d); }
  /* 一行小纸签：名字 + 状态色点，挂在图标下方 */
  .hang .tag .str { height: 6px !important; }
  .hang .tag .paper { position: absolute; left: 0; top: 5px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 6px; border-radius: 4px; background: oklch(0.975 0.015 90);
    box-shadow: 0 1px 0 oklch(0.85 0.02 90), 2px 4px 5px oklch(0.4 0.03 100 / .18); white-space: nowrap; }
  .hang .tag .nm { font-size: 12px; line-height: 1.3; color: var(--ink); }
  .hang .tag .st { display: inline-flex; align-items: center; font-size: 0; }
  .hang .tag .st i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px oklch(0.975 0.015 90); }
  .hang .tag .st b { display: none; }
  .hang:hover .tag .st { font-size: 12px; color: var(--ink-2); gap: 3px; }
  .hang:hover .tag .st b { display: inline; font-weight: 400; }
  .hang .tag .st i { width: 7px; height: 7px; border-radius: 50%; }
  .st .damp { background: oklch(0.62 0.11 235); } .st .mold { background: oklch(0.58 0.1 305); } .st .char { background: oklch(0.45 0.04 55); } .st .ripe { background: var(--carp); } .st .ok { background: oklch(0.64 0.12 155); }
  .hang:hover .icon { transform: translateY(-3px) scale(1.06); }
  .hang.dragging .body { cursor: grabbing; }
  .hang.hidden { display: none; }
  .hang.dry .icon { filter: drop-shadow(0 0 10px oklch(0.95 0.12 92 / .7)) drop-shadow(3px 7px 5px oklch(0.35 0.03 120 / .22)); }

  /* 盆里的对象：浮在水面，下方实时倒影（box-reflect 反射的是擦拭画布本身） */
  #float { position: absolute; left: 380px; top: 300px; width: 200px; height: 200px; pointer-events: none; }
  #float .bob { position: absolute; inset: 0; animation: bob 3.8s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.2deg) } 50% { transform: translateY(5px) rotate(1deg) } }
  #wipe { position: absolute; left: 0; top: 0; pointer-events: auto; -webkit-box-reflect: below -6px linear-gradient(transparent 62%, oklch(0 0 0 / .22)); }
  #mushroom { position: absolute; left: 0; top: -54px; width: 200px; height: 200px; pointer-events: none; display: none; filter: drop-shadow(2px 6px 4px oklch(0.3 0.04 120 / .3)); }
  #cutline { position: absolute; left: 34px; right: 34px; top: 74px; height: 0; border-top: 3px dashed oklch(1 0 0 / .95); filter: drop-shadow(0 1px 1px oklch(0 0 0 / .45)); opacity: 0; transition: opacity .2s; }
  #hint { position: absolute; left: 320px; width: 320px; top: 600px; white-space: nowrap; text-align: center; font-size: 14px; color: var(--ink-2); transition: opacity .25s; }
  #hint kbd { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 4px; background: oklch(1 0 0 / .7); box-shadow: 0 1px 0 oklch(0.75 0.02 100); font: 12px var(--num); color: var(--ink); }

  /* 层进度：搭在盆沿上的两枚搪瓷小牌 */
  #layers { position: absolute; left: 480px; top: 556px; transform: translateX(-50%); display: flex; gap: 10px; }
  .lchip { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 5px; border-radius: 15px; background: var(--enamel); font-size: 13px; font-weight: 500;
    box-shadow: inset 0 0 0 2px var(--cobalt), 0 3px 0 oklch(0.8 0.02 100), 0 6px 10px oklch(0.4 0.03 100 / .15); }
  .lchip .ring { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(var(--cobalt) calc(var(--p) * 1turn), oklch(0.9 0.01 250) 0); display: grid; place-items: center; }
  .lchip .ring::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--enamel); }
  .lchip.done { background: oklch(0.94 0.06 155); animation: pop .55s cubic-bezier(.3,1.9,.5,1); }
  .lchip.done .ring { background: oklch(0.6 0.12 155); }
  @keyframes pop { 35% { transform: scale(1.22) } 70% { transform: scale(.96) } }

  /* 工具：木板上的铜钩 */
  #rack { position: absolute; left: 34px; top: 284px; width: 224px; height: 150px; }
  .tool { position: absolute; top: 22px; width: 52px; height: 112px; transform-origin: 26px 4px; cursor: pointer; }
  .tool .loop { position: absolute; left: 25px; top: 4px; width: 1.5px; height: 18px; background: var(--rope-d); }
  .tool img { position: absolute; left: -6px; top: 18px; width: 64px; height: 64px; filter: drop-shadow(3px 6px 4px oklch(0.3 0.03 90 / .32)); transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; pointer-events: none; }
  .tool .name { position: absolute; left: -10px; right: -10px; top: 86px; text-align: center; font-size: 12px; color: var(--ink-2); }
  .tool .key { display: inline-block; margin-left: 3px; padding: 0 4px; border-radius: 3px; background: oklch(1 0 0 / .65); font: 11px var(--num); color: var(--ink-3); }
  .tool:hover img { transform: rotate(-6deg) translateY(-2px); }
  .tool.taken img { opacity: 0; }
  .tool.off .name { color: var(--ink-3); }
  .tool.off img { filter: saturate(.55) drop-shadow(3px 6px 4px oklch(0.3 0.03 90 / .2)); }

  /* 跟手工具 */
  #cursor { position: fixed; left: 0; top: 0; width: 76px; height: 76px; pointer-events: none; z-index: 50; display: none; }
  #cursor img { width: 76px; height: 76px; transform-origin: 28% 28%; filter: drop-shadow(4px 10px 6px oklch(0.25 0.03 90 / .35)); }

  /* 天气便签：图钉钉在墙上 */
  #note { position: absolute; left: 30px; top: 438px; width: 246px; height: 172px; transform: rotate(-2.2deg); transform-origin: 50% 6px; animation: noteSway 6s ease-in-out infinite; }
  @keyframes noteSway { 0%, 100% { transform: rotate(-2.2deg) } 50% { transform: rotate(-.6deg) } }
  #note .city { position: absolute; left: 22px; top: 26px; font-size: 17px; font-weight: 700; }
  #note .cond { position: absolute; left: 22px; top: 50px; font-size: 13px; color: var(--ink-2); }
  #note .hum { position: absolute; right: 20px; top: 20px; font: 40px/1 var(--num); color: var(--cobalt); letter-spacing: -1px; }
  #note .hum small { font-size: 18px; }
  #note .hum-l { position: absolute; right: 22px; top: 62px; font-size: 12px; color: var(--ink-3); }
  #note .line { position: absolute; left: 22px; right: 18px; top: 86px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  #note .stamp { position: absolute; right: 14px; bottom: 16px; transform: rotate(-8deg); }

  /* 菇币罐 */
  #jar { position: absolute; left: 820px; top: 456px; width: 110px; height: 130px; }
  #jar .num { position: absolute; left: 0; right: 0; top: 72px; text-align: center; font: 22px/1 var(--num); color: var(--ink); }
  #jar .lbl { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 11px; color: var(--ink-2); }
  #jar.bump { animation: pop .4s; }

  #basket { position: absolute; left: 672px; top: 520px; width: 112px; height: 84px; cursor: pointer; }
  #basket img { width: 112px; height: 84px; object-fit: contain; filter: drop-shadow(3px 8px 5px oklch(0.3 0.03 80 / .3)); }
  #basket .count { position: absolute; right: 2px; top: -4px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--carp); color: white; font: 13px/24px var(--num); text-align: center; box-shadow: 0 2px 0 oklch(0.48 0.15 30); }
  #journal { position: absolute; left: 214px; top: 572px; width: 96px; height: 66px; cursor: pointer; transform: rotate(-7deg); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  #journal:hover { transform: rotate(-2deg) translateY(-5px); }

  #toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -70px); padding: 9px 18px; border-radius: 99px; background: var(--ink); color: var(--enamel); font-size: 14px; transition: transform .35s cubic-bezier(.3,1.5,.5,1); z-index: 60; white-space: nowrap; box-shadow: 0 6px 16px oklch(0.2 0.03 250 / .25); }
  #toast.show { transform: translate(-50%, 0); }
  #sound { position: absolute; right: 14px; bottom: 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; padding: 3px 10px; border-radius: 99px; background: oklch(1 0 0 / .55); }
  .footnote { position: absolute; left: 14px; top: 8px; font-size: 11px; color: var(--ink-3); }
  .ripple { position: absolute; border: 2px solid oklch(1 0 0 / .8); border-radius: 50%; pointer-events: none; }
  .drip { position: absolute; width: 5px; height: 7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: oklch(0.78 0.08 230); box-shadow: inset -1px -1px 0 oklch(0.65 0.09 235); pointer-events: none; }
  .mote { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: oklch(0.99 0.05 95); pointer-events: none; }
  .steam { position: absolute; width: 14px; height: 30px; border-radius: 50%; border-left: 2px solid oklch(1 0 0 / .7); pointer-events: none; }
</style>
</head>
<body>
<div id="room">
  <svg class="layer" id="backdrop" width="960" height="640" viewBox="0 0 960 640"></svg>
  <svg class="layer" id="ropes" width="960" height="640" viewBox="0 0 960 640"></svg>
  <div id="hangs"></div>

  <div id="rack"></div>
  <svg class="layer" id="basinBack" width="960" height="640" viewBox="0 0 960 640"></svg>
  <div id="float"><div class="bob"><div id="wipe"></div><img id="mushroom" alt=""><div id="cutline"></div></div></div>
  <svg class="layer" id="basinFront" width="960" height="640" viewBox="0 0 960 640"></svg>
  <div id="layers"></div>
  <div id="hint">把绳上的东西<b>往下拽</b>，或者点一下</div>

  <div id="note">
    <svg class="layer" width="246" height="172" viewBox="0 0 246 172" id="noteArt"></svg>
    <div class="city">重庆 · 渝中</div>
    <div class="cond">小雨 · 18°C</div>
    <div class="hum">92<small>%</small></div>
    <div class="hum-l">湿度 · 09:40 更新</div>
    <div class="line">墙在出汗，衣服晾不干。<br>水滴风铃菇正在冒头。</div>
    <svg class="stamp" width="104" height="40" viewBox="0 0 104 40" id="stamp"></svg>
  </div>

  <div id="journal"><svg width="96" height="66" viewBox="0 0 96 66" id="journalArt"></svg></div>
  <div id="basket"><img src="../../src/renderer/public/assets/care/basket.png" alt="采菇篮"><div class="count">0</div></div>
  <div id="jar"><svg width="110" height="130" viewBox="0 0 110 130" id="jarArt"></svg><div class="num">24</div><div class="lbl">菇币</div></div>

  <div id="toast"></div>
  <div id="sound">音效 开</div>
  <div class="footnote">方向稿 v2 · 场景为程序化插画占位，图标与菇为真实素材</div>
  <div id="cursor"><img alt=""></div>
</div>
<script src="assets/objects.js"></script>
<script src="assets/engine.js"></script>
<script>
(() => {
  'use strict';
  const { CDWipe, CDSound, CDFx, CDSpring } = window.CDEngine;
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const SPECIES = '../../src/renderer/public/assets/care/species/';
  const TOOLS_DIR = '../../previews/visual-assets-2026-10-24/repair-tools-v1/png/';
  const CARE = '../../src/renderer/public/assets/care/';
  const FAMILY = { damp: '受潮', mold: '霉变', char: '焦化' };
  const LEVEL = ['', '轻', '中', '重'];
  const LAYERS = { damp: ['水珠', '水膜'], mold: ['霉斑'], char: ['烟灰', '焦痕'] };
  const SPECIES_ZH = { archive: '压缩包菇', waterfall: '截图瀑布菇', broken: '断线菇' };
  // 稳定伪随机：同一场景每次打开一样（mulberry32）
  let seed = 20261026;
  const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ================= 场景几何 =================
  const MAIN = { x1: 26, y1: 66, x2: 696, y2: 60, sag: 52 };
  const SUN = { x1: 722, y1: 306, x2: 944, y2: 298, sag: 18 };
  const WIN = { x: 728, y: 24, w: 186, h: 178 };
  const BASIN = { cx: 480, cy: 470, rx: 196, ry: 50, wrx: 170, wry: 37, wcy: 485 };

  // ================= 背景插画（静态 SVG） =================
  function buildBackdrop() {
    const chips = [];
    for (let i = 0; i < 260; i += 1) {
      const x = rnd() * 960, y = 470 + rnd() * 170, r = 1 + rnd() * 3.2;
      const c = ['oklch(0.62 0.03 60)', 'oklch(0.72 0.04 30)', 'oklch(0.5 0.02 250)', 'oklch(0.9 0.01 90)', 'oklch(0.66 0.05 140)'][Math.floor(rnd() * 5)];
      chips.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * (0.5 + rnd() * 0.4)).toFixed(1)}" transform="rotate(${Math.round(rnd() * 180)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${c}" opacity=".7"/>`);
    }
    const drops = [];
    for (let i = 0; i < 70; i += 1) {
      const x = WIN.x + 14 + rnd() * (WIN.w - 28), y = WIN.y + 14 + rnd() * (WIN.h - 28), r = 0.8 + rnd() * 2.6;
      drops.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="oklch(1 0 0 / .35)"/><circle cx="${(x - r * 0.3).toFixed(1)}" cy="${(y - r * 0.35).toFixed(1)}" r="${(r * 0.35).toFixed(1)}" fill="oklch(1 0 0 / .8)"/>`);
    }
    const rain = [];
    for (let i = 0; i < 26; i += 1) {
      const x = WIN.x + rnd() * WIN.w, y = WIN.y - 40 + rnd() * (WIN.h + 40);
      rain.push(`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x - 2).toFixed(1)}" y2="${(y + 12).toFixed(1)}" stroke="oklch(0.97 0.02 230 / .7)" stroke-width="1.2" stroke-linecap="round"/>`);
    }
    // 山城楼群剪影（窗外）
    let city = '';
    let bx = WIN.x - 4;
    while (bx < WIN.x + WIN.w) {
      const w = 14 + rnd() * 22, h = 40 + rnd() * 70;
      city += `<rect x="${bx.toFixed(1)}" y="${(WIN.y + WIN.h - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="oklch(0.62 0.03 230 / ${(0.35 + rnd() * 0.3).toFixed(2)})"/>`;
      bx += w + 3;
    }
    const tiles = 'url(#tiles)';
    $('backdrop').innerHTML = `
    <defs>
      <filter id="plaster" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .52  0 0 0 0 .45  0 0 0 .08 0"/>
        <feComposite in2="SourceGraphic" operator="in"/>
      </filter>
      <filter id="stainShape" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="9" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="5"/>
      </filter>
      <filter id="stainEdge" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="9" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="1.2"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
      <pattern id="tiles" width="38" height="38" patternUnits="userSpaceOnUse" x="0" y="392">
        <rect width="38" height="38" fill="oklch(0.80 0.03 165)"/>
        <rect x="1.2" y="1.2" width="35.6" height="35.6" rx="3" fill="oklch(0.90 0.035 165)"/>
        <rect x="3" y="3" width="20" height="6" rx="3" fill="oklch(1 0 0 / .45)"/>
      </pattern>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.965 0.011 95)"/><stop offset="1" stop-color="oklch(0.925 0.017 100)"/></linearGradient>
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.84 0.025 80)"/><stop offset="1" stop-color="oklch(0.78 0.03 75)"/></linearGradient>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.86 0.03 235)"/><stop offset="1" stop-color="oklch(0.93 0.02 210)"/></linearGradient>
      <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.95 0.1 92 / .55)"/><stop offset=".6" stop-color="oklch(0.95 0.1 92 / .18)"/><stop offset="1" stop-color="oklch(0.95 0.1 92 / 0)"/></linearGradient>
      <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.76 0.08 70)"/><stop offset="1" stop-color="oklch(0.62 0.08 62)"/></linearGradient>
      <clipPath id="glass"><rect x="${WIN.x + 10}" y="${WIN.y + 10}" width="${WIN.w - 20}" height="${WIN.h - 20}" rx="6"/></clipPath>
    </defs>
    <!-- 墙 -->
    <rect width="960" height="470" fill="url(#wallG)"/>
    <rect width="960" height="470" fill="white" filter="url(#plaster)"/>
    <!-- 返潮水渍：内部低彩灰绿，边缘一圈更深的"潮线" -->

  // ================= 绳：点荷载叠加（真实绳子被拽的样子是两段直线到钉子） =================
  const ropeBase = (r, x) => { const t = (x - r.x1) / (r.x2 - r.x1); return r.y1 + (r.y2 - r.y1) * t + Math.sin(Math.PI * t) * r.sag; };
  function ropeY(r, x, hangsOnRope) {
    let y = ropeBase(r, x);
    for (const h of hangsOnRope) {
      const d = h.load;
      if (d === 0) continue;
      const xi = h.ax;
      y += x <= xi ? d * (x - r.x1) / Math.max(1, xi - r.x1) : d * (r.x2 - x) / Math.max(1, r.x2 - xi);
    }
    return y;
  }
  function ropePath(r, list, dx = 0, dy = 0) {
    let d = '';
    for (let i = 0; i <= 64; i += 1) {
      const x = r.x1 + (r.x2 - r.x1) * (i / 64);
      d += `${i ? 'L' : 'M'}${(x + dx).toFixed(1)},${(ropeY(r, x, list) + dy).toFixed(1)}`;
    }
    return d;
  }
  function drawRopes() {
    const on = (r) => hangs.filter((h) => h.rope === r && !h.gone);
    let s = '<defs><filter id="rshadow"><feGaussianBlur stdDeviation="2.5"/></filter></defs>';
    for (const r of [MAIN, SUN]) {
      const list = on(r);
      s += `<path d="${ropePath(r, list, 5, 9)}" fill="none" stroke="oklch(0.35 0.03 90 / .18)" stroke-width="4" filter="url(#rshadow)"/>`;
      s += `<path d="${ropePath(r, list)}" fill="none" stroke="var(--rope-d)" stroke-width="4.6" stroke-linecap="round"/>`;
      s += `<path d="${ropePath(r, list)}" fill="none" stroke="var(--rope)" stroke-width="3" stroke-linecap="round"/>`;
      s += `<path d="${ropePath(r, list, 0, -0.6)}" fill="none" stroke="oklch(0.84 0.05 80)" stroke-width="1.2" stroke-dasharray="2.2 3.4" stroke-linecap="round"/>`;
    }
    $('ropes').innerHTML = s;
  }

  // ================= 挂件 =================
  const PIN_SVG = `<svg class="pin" viewBox="0 0 16 40" width="16" height="40">
    <rect x="1" y="1" width="6.6" height="38" rx="2.5" fill="var(--wood-l)" stroke="var(--wood-d)" stroke-width="1"/>
    <rect x="8.4" y="1" width="6.6" height="38" rx="2.5" fill="var(--wood)" stroke="var(--wood-d)" stroke-width="1"/>

    <circle cx="8" cy="18" r="2" fill="oklch(0.88 0.01 250)"/></svg>`;
  const objects = window.CD_OBJECTS.map((o) => ({ ...o, done: false }));
  const hangs = [];
  function statusOf(o) {
    if (o.done) return ['ok', '晒干中'];
    if (o.mushroom === 'mature') return ['ripe', '有菇可采'];
    return [o.family, `${FAMILY[o.family]} · ${LEVEL[o.stage]}`];
  }
  function makeHang(o, rope) {
    const el = document.createElement('div');
    el.className = 'hang' + (o.done ? ' dry' : '');
    const [cls, txt] = statusOf(o);
    el.innerHTML = `<div class="body">${PIN_SVG}<img class="icon" src="${o.done ? o.clean : (o.desk || o.dirty)}" alt=""></div>
      <div class="tag"><div class="str"></div><div class="paper"><span class="st"><i class="${cls}"></i><b>${txt}</b></span><span class="nm">${o.name}</span></div></div>`;
    $('hangs').appendChild(el);
    const h = { o, el, rope, slot: 0.5, ax: 0, load: 7, weight: 7, swing: 0, swingV: 0, tagSwing: 0, tagV: 0, lastAx: 0, phase: Math.random() * 6, drag: null, gone: false };
    h.axSpring = CDSpring(0, { stiffness: 0.08, damping: 0.82 });
    const body = el.querySelector('.body');
    body.addEventListener('pointerenter', () => { if (!h.drag) { h.swingV += 1.6; CDSound.tap(); } });
    body.addEventListener('pointerdown', (e) => startDrag(h, e));
    hangs.push(h);
    return h;
  }
  function layout(instant) {
    for (const r of [MAIN, SUN]) {
      const list = hangs.filter((h) => h.rope === r && !h.gone && !h.drag);
      const pad = r === MAIN ? 0.07 : 0.16;
      list.forEach((h, i) => {

  }

  // 拽下来：往下拉，绳子跟着弯；超过阈值弹脱飞进盆
  const DETACH = 112;
  function startDrag(h, e) {
    if (h.o.done || e.button !== 0) return;
    e.preventDefault();
    const body = h.el.querySelector('.body');
    try { body.setPointerCapture(e.pointerId); } catch (_) { /* 合成指针 */ }
    h.drag = { x0: e.clientX, y0: e.clientY, grabDy: e.clientY - ropeY(h.rope, h.ax, []), moved: 0 };
    h.el.classList.add('dragging');
    CDSound.pick();
    const move = (ev) => {
      if (!h.drag) return;
      const dx = ev.clientX - h.drag.x0, dy = ev.clientY - h.drag.y0;
      h.drag.moved = Math.max(h.drag.moved, Math.hypot(dx, dy));
      h.dragX = Math.max(h.rope.x1 + 30, Math.min(h.rope.x2 - 30, h.axSpring.value + dx * 0.55));
      h.dragLoad = Math.max(0, h.weight + dy);
      if (h.dragLoad > DETACH) finish(true, ev);
    };
    const finish = (detach, ev) => {
      body.removeEventListener('pointermove', move);
      body.removeEventListener('pointerup', up);
      body.removeEventListener('pointercancel', cancel);
      const wasClick = h.drag && h.drag.moved < 6;
      h.drag = null;
      h.el.classList.remove('dragging');
      if (detach) { pop(h); return; }
      if (wasClick) { autoPull(h); return; }

      h.load = h.dragLoad ?? h.weight;
      h.loadV = -6;
      h.swingV += (Math.random() - 0.5) * 6;
      CDSound.drop();
    };
    const up = (ev) => finish(false, ev);
    const cancel = (ev) => finish(false, ev);
    body.addEventListener('pointermove', move);
    body.addEventListener('pointerup', up);
    body.addEventListener('pointercancel', cancel);
  }
  // 点一下 = 帮你拽：一段向下的缓动，最后弹脱
  function autoPull(h) {

    (function step() {

      h.dragLoad = h.weight + (DETACH + 4 - h.weight) * (k * k);
      if (k < 1) requestAnimationFrame(step); else { h.autoPulling = false; pop(h); }
    })();
  }
  async function pop(h) {
    if (current) returnToRope(true);
    const icon = h.el.querySelector('.icon');
    const from = icon.getBoundingClientRect();
    h.gone = true;
    h.el.classList.add('hidden');
    // 绳子失去荷载：猛地弹回再晃
    h.load = 0; h.dragLoad = undefined;
    ropeKick(h.rope, h.ax, -18);
    CDSound.snip();
    const fly = document.createElement('img');
    fly.src = h.o.desk || h.o.dirty;
    Object.assign(fly.style, { position: 'fixed', left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px', zIndex: 40, pointerEvents: 'none', filter: 'drop-shadow(4px 10px 6px oklch(0.3 0.03 90 / .35))' });
    document.body.appendChild(fly);
    const to = $('float').getBoundingClientRect();
    const tx = to.left - from.left, ty = to.top - from.top, sc = to.width / from.width;
    await fly.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${tx * 0.45}px, ${ty * 0.25 - 70}px) scale(${1 + (sc - 1) * 0.5}) rotate(-14deg)`, offset: 0.45 },
      { transform: `translate(${tx * 0.96}px, ${ty * 1.04}px) scale(${sc * 1.03}) rotate(3deg)`, offset: 0.86 },
      { transform: `translate(${tx}px, ${ty}px) scale(${sc}) rotate(0deg)` },
    ], { duration: 680, easing: 'cubic-bezier(.45,0,.25,1)' }).finished;
    fly.remove();
    CDSound.drop();
    const b = $('float').getBoundingClientRect();

  // 绳子整体回弹：给同一根绳上其他挂件一个摆动
  const ropeKicks = [];
  function ropeKick(r, x, amp) { ropeKicks.push({ r, x, amp, t: 0 }); hangs.forEach((o) => { if (o.rope === r && !o.gone) o.swingV += (o.ax < x ? -1 : 1) * 1.8; }); }

  // 主循环：荷载弹簧、摆动、绳子形状、挂件位置

  // ================= 工具架 =================

  // ================= 盆里护理 =================

    CDFx.sparkle(targetX, ropeBase(SUN, targetX) + 40, 14);
    const left = objects.filter((o) => !o.done).length;
    if (left === 0) toast('都晾干了！今天的桌面清清爽爽');
  }

  // ================= 杂项 =================
  let toastTimer = 0;
  function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2300); }
  function setHint(html) { $('hint').innerHTML = html; }
  $('journal').addEventListener('click', () => toast('手账（图鉴 · 小铺 · 墙面 · 设置）在定稿后展开'));
  $('basket').addEventListener('click', () => toast(basketCount ? `篮子里有 ${basketCount} 朵菇` : '篮子还空着'));
  $('sound').addEventListener('click', () => { CDSound.enabled = !CDSound.enabled; $('sound').textContent = '音效 ' + (CDSound.enabled ? '开' : '关'); });

  buildBackdrop();
  buildBasin();
  buildProps();
  objects.forEach((o) => makeHang(o, MAIN));
  layout(true);
  hangs.forEach((h) => { h.lastAx = h.axSpring.value; h.ax = h.lastAx; });
  refreshTools();
  requestAnimationFrame(frame);
  window.__demo = {
    pick: (i) => autoPull(hangs.filter((h) => h.rope === MAIN && !h.gone)[i]),
    selectTool: (i) => selectTool(TOOLS[i]),
  };
})();
</script>
</body>
</html>
