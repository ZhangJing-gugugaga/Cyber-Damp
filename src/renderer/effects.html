<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回南天 · 动态材质样片</title></head><body>
<main><h1>动态材质样片</h1><p>独立预览。使用正式 FileSprite、旧版材质与滤镜，不连接真实桌面或存档。每个对象左侧为 48px，右侧放大 2.5 倍。</p>
<nav id="presets" aria-label="样片"></nav><h2 id="sample-name"></h2>
<div class="controls"><button id="replay">重播</button><button id="play">暂停</button><button id="reset">复位</button><label><input id="original" type="checkbox">原图对照</label><label>进度 <input id="progress" type="range" min="0" max="1000" value="0"></label><output id="progress-value">0%</output></div>
<div id="scene"></div><p><button id="measure">变形前霉变覆盖</button> <button id="measure-composite">变形后联合覆盖</button> <output id="coverage" aria-live="polite"></output></p><p>联合覆盖包括霉斑、菇体/阴影、焦化与折痕，并经过当前卷曲/鼓胀/缩水变形。投影面积另列，不把缩水消失的像素算作遮挡；水光与颜料另行观察。护理曲线是效果演示，不代表自动清洗。正常尺寸能否辨认仍须实际观察。</p><p><a href="./manage.html?preview=1">工具柜界面</a>　<a href="./manage.html?preview=1&amp;layout=inventory">物品栏界面</a>　<a href="./specials.html">特殊菇根部与命中预览</a></p></main><script type="module" src="./preview/effect-library.ts"></script></body></html>
