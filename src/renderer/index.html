<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP：零远程内容（AC-25 相邻）；放宽 inline/ws 仅为 Vite dev HMR，生产无远程加载 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: http://localhost:*; media-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>回南天 Cyber Damp</title>
  <!-- 设计 Token：从 design-system/design-tokens.css 复制（design-system/ 为唯一真相源） -->
  <link rel="stylesheet" href="./ui/tokens.css" />
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background: transparent;
    }
    /* in-world 画布层：全工作区透明，由 Pixi.js 挂载 */
    #stage { position: fixed; inset: 0; }
    /* DOM 覆盖层：气象牌/商店/工具箱/气泡/控制台；pointer-events 按元素纪律分配 */
    #ui-root { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ui-root"></div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
